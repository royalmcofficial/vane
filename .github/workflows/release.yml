name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and upload, e.g. v1.22.0'
        required: true

permissions:
  contents: write

# Never run two releases for the same tag at once; a re-pushed tag waits for the previous run.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      # The jars carry the project version (and vane-core the matching resource pack URL),
      # so a tag that disagrees with build.gradle.kts would publish mislabeled artifacts.
      # RoyalMC recovery tags add a build number without changing the packaged project version.
      - name: Check tag matches project version
        run: |
          version=$(sed -n 's/^ *version = "\(.*\)"$/\1/p' build.gradle.kts)
          fork_revision=false
          if [ "$TAG" != "v$version" ]; then
            if [ "$GITHUB_REPOSITORY" = "royalmcofficial/vane" ] &&
              [[ "$TAG" =~ ^v(.+)\+royalmc\.([1-9][0-9]*)$ ]] &&
              [ "${BASH_REMATCH[1]}" = "$version" ]; then
              fork_revision=true
            else
              echo "::error::Tag $TAG does not match project version $version in build.gradle.kts"
              exit 1
            fi
          fi
          if [ -z "$version" ]; then
            echo "::error::Could not read project version from build.gradle.kts"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "FORK_REVISION=$fork_revision" >> "$GITHUB_ENV"

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'corretto'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Gradle build
        run: ./gradlew build

      # Same layout as upstream: only the Paper server plugins, flat. vane-velocity goes on the
      # proxy and vane-geyser-extension into Geyser, so both are uploaded separately only.
      - name: Create all-plugins.zip
        run: |
          cd target
          zip -X all-plugins.zip vane-{admin,bedtime,busybar,core,enchantments,permissions,portals,regions,trifles}-"$VERSION".jar

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      # The BUSY Bar bridge carries the same version; PEP 440 normalizes 1.23.0-beta.2 to 1.23.0b2.
      - name: Build BUSY Bar bridge
        working-directory: vane-busybar/bridge
        run: |
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          pip install build
          python -m build --outdir ../../target/bridge

      # Create a draft first so incomplete builds can never publish a partial release.
      # Tags with a semver pre-release suffix are kept out of releases/latest and update notices.
      - name: Upload to GitHub release
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$GITHUB_REPOSITORY" == "royalmcofficial/vane" && "$is_draft" != "true" ]]; then
              echo "Release $TAG is already published. Skipping asset replacement."
              echo "already_published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            prerelease=()
            [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
            gh release create "$TAG" --draft --verify-tag --generate-notes --title "$TAG" "${prerelease[@]}"
          fi
          gh release upload "$TAG" --clobber target/vane-*-"$VERSION".jar target/all-plugins.zip target/barmc-"$VERSION".zip target/bridge/*

      # Keep upstream releases as drafts. Publishing is enabled automatically on the RoyalMC fork.
      - name: Publish release on fork
        if: ${{ github.repository == 'royalmcofficial/vane' && steps.upload.outputs.already_published != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$FORK_REVISION" == "true" && "$VERSION" != *-* ]]; then
            gh release edit "$TAG" --draft=false --latest
          else
            gh release edit "$TAG" --draft=false
          fi
